<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sultana Nexus™ | Enterprise Dental Operating Suite</title>
    <!-- 🔌 CORE LIBRARIES INTEGRATION: TWIND (TAILWIND IN THE BROWSER ENG) -->
    <script src="https://jsdelivr.net"></script>
    <style>
        body { background-color: #030712; color: #ffffff; }
        .sultana-gold { color: #d4af37; }
        .bg-sultana-gold { background-color: #d4af37; }
        .border-gold { border-color: #d4af37; }
        .module-tab {
            background-color: #0f172a; border: 1px solid #1e293b;
            border-radius: 8px; padding: 12px 20px; font-weight: bold;
            cursor: pointer; transition: all 0.2s ease; text-transform: uppercase; font-size: 12px; letter-spacing: 1px;
        }
        .module-tab.active { border-color: #d4af37; background-color: #1e1b4b; color: #d4af37; }
        .app-container { background-color: #0f172a; border: 1px solid #1e293b; border-radius: 12px; min-height: 450px; }
    </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col">

    <!-- BRAND NAV DESK -->
    <header class="max-w-7xl mx-auto w-full pt-8 pb-4 px-6 flex flex-col md:flex-row justify-between items-center border-b border-gray-900 gap-4">
        <div class="flex items-center gap-3">
            <span class="text-3xl">👑</span>
            <div>
                <h1 class="text-xl font-black uppercase tracking-wider text-white">Sultana <span class="sultana-gold">Nexus™</span></h1>
                <p class="text-[10px] text-gray-400 uppercase tracking-widest">Enterprise Dental Core Operating Suite</p>
            </div>
        </div>
        <!-- CORE MODULAR HANDSHAKE TABS -->
        <div class="flex flex-wrap gap-2 justify-center">
            <button class="module-tab active" onclick="switchModule('chartmax')">📊 ChartMax</button>
            <button class="module-tab" onclick="switchModule('aligniq')">💎 AlignIQ</button>
            <button class="module-tab" onclick="switchModule('endoapex')">🔬 EndoApex</button>
            <button class="module-tab" onclick="switchModule('periomap')">📈 PerioMap</button>
            <button class="module-tab" onclick="switchModule('labfab')">📐 LabFab</button>
        </div>
    </header>

    <!-- LIVE MODULAR WORKSPACE MATRIX -->
    <main class="flex-grow max-w-7xl mx-auto w-full p-6">
        <div id="module-display" class="app-container p-6 shadow-2xl transition-all duration-300">
            <!-- DEFAULT ENGINE LOADS HERE VIA JAVASCRIPT OVERLAY -->
        </div>
    </main>

    <!-- COHORT FOOTER COMPLIANCE -->
    <footer class="bg-black text-center py-6 text-[10px] border-t border-gray-900 px-6 text-gray-500">
        <p class="font-bold text-gray-400 mb-1">&copy; 2026 Sultana Dental Group MSO • Tech Systems Division.</p>
        <p>Sultana Nexus™ executes open-source architecture virtualization overlays inside sandboxed client networks. All storage layers sync natively with physical local appliance vaults.</p>
    </footer>

    <!-- JAVASCRIPT CORE INTERFACE CONTROLLER -->
    <script>
        // 🔬 DATA CONVERTERS & VIEW TEMPLATES STORAGE GRID
        const modules = {
            chartmax: `
                <div class="space-y-4">
                    <h2 class="text-lg font-bold uppercase text-white tracking-wide border-b border-gray-800 pb-2">📊 Sultana ChartMax™ <span class="text-xs font-normal text-gray-400 lowercase ml-2">odental core sandbox v24.3</span></h2>
                    <p class="text-xs text-gray-400">Haga clic en una pieza anatómica para registrar patologías o iniciar un expediente clínico digital.</p>
                    <div class="grid grid-cols-8 md:grid-cols-16 gap-2 pt-4">
                        ${Array.from({length: 32}, (_, i) => `
                            <div id="tooth-${i+1}" onclick="toggleTooth(${i+1})" class="border border-gray-800 bg-gray-900 rounded p-3 text-center cursor-pointer hover:border-yellow-500 transition-colors">
                                <div class="text-xs font-bold block text-gray-400 mb-1">${i+1}</div>
                                <span class="text-xl">🦷</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `,
            aligniq: `
                <div class="space-y-4 flex flex-col h-full justify-between">
                    <div>
                        <h2 class="text-lg font-bold uppercase text-white tracking-wide border-b border-gray-800 pb-2">💎 Sultana AlignIQ™ <span class="text-xs font-normal text-gray-400 lowercase ml-2">three.js mesh vector engine</span></h2>
                        <p class="text-xs text-gray-400">Arrastre el archivo .STL del escaneo intraoral para inicializar el cálculo de alineadores invisibles.</p>
                    </div>
                    <div class="border-2 border-dashed border-gray-800 bg-gray-950 rounded-xl p-12 text-center hover:border-gold transition-colors flex flex-col items-center justify-center my-6">
                        <span class="text-4xl mb-3">📐</span>
                        <p class="text-sm font-bold text-gray-300">Arrastre y Suelte el Modelo 3D Aquí</p>
                        <p class="text-[11px] text-gray-500 mt-1">Formatos admitidos de alta resolución: .STL / .PLY</p>
                    </div>
                    <div class="grid grid-cols-3 gap-4 bg-gray-950 p-4 rounded-lg border border-gray-900">
                        <div><label class="text-[10px] uppercase font-bold text-gray-500">Traducción Vector X</label><input type="range" class="w-full accent-yellow-600 mt-1"></div>
                        <div><label class="text-[10px] uppercase font-bold text-gray-500">Rotación Vector Y</label><input type="range" class="w-full accent-yellow-600 mt-1"></div>

                    </div>
                </div>
            `,
            endoapex: `
                <div class="space-y-4 h-full flex flex-col justify-between">

                        <p class="text-xs text-gray-400">Visualizador multi-planar activo. Indexando archivos DICOM en tiempo real desde el almacenamiento local appliance.</p>
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 flex-grow my-4">
                        <div class="bg-black border border-gray-800 rounded p-3 text-center flex flex-col justify-between min-h-[200px]">
                            <span class="text-[10px] uppercase font-bold text-gray-500 tracking-wider block text-left">Vista Axial (Superior)</span>
                            <span class="text-3xl block my-auto text-gray-800">🩻</span>
                            <span class="text-[9px] text-gray-600 block text-right">Slice 124/256</span>

                        <div class="bg-black border border-gray-800 rounded p-3 text-center flex flex-col justify-between min-h-[200px]">

                            <span class="text-3xl block my-auto text-gray-800">🩻</span>
                            <span class="text-[9px] text-gray-600 block text-right">Slice 089/256</span>
                        </div>
                        <div class="bg-black border border-gray-800 rounded p-3 text-center flex flex-col justify-between min-h-[200px]">
                            <span class="text-[10px] uppercase font-bold text-gray-500 tracking-wider block text-left">Vista Coronal (Frontal)</span>
                            <span class="text-3xl block my-auto text-gray-800">🩻</span>
                            <span class="text-[9px] text-gray-600 block text-right">Slice 112/256</span>
                        </div>
                    </div>
                </div>
            `,
            periomap: `
                <div class="space-y-4">

                            <thead>
                                <tr class="bg-gray-900 text-gray-400 text-[10px] uppercase font-bold tracking-wider border-b border-gray-800">
                                    <th class="p-3">Pieza</th>
                                    <th class="p-3">V-Mesial</th><th class="p-3">V-Centro</th><th class="p-3">V-Distal</th>
                                    <th class="p-3">L-Mesial</th><th class="p-3">L-Centro</th><th class="p-3">L-Distal</th>
                                </tr>
                            </thead>
                            <tbody class="text-xs divide-y divide-gray-900">
                                ${Array.from({length: 8}, (_, i) => `
                                    <tr class="hover:bg-gray-900/50 transition-colors">
