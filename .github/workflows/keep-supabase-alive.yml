name: Sultana Nexus Keep-Alive Engine

on:
  schedule:
    # Runs automatically every 3 days at midnight (00:00)
    - cron: '0 0 */3 * *'
  workflow_dispatch: # Allows you to trigger it manually anytime

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send Activity Heartbeat to REST API
        run: |
          curl -i -X GET "https://wmscuqbxvgqsyafcstsv.supabase.com" \
          -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
          -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
