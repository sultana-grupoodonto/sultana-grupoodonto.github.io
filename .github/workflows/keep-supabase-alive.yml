name: Sultana Nexus Keep-Alive Engine

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  ping-supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Send Activity Heartbeat to REST API
        run: curl -i -X GET "https://wmscuqbxvgqsyafcstsv.supabase.com" -H "apikey:${{ secrets.SUPABASE_ANON_KEY }}" -H "Authorization:Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
